services:
  mcelroy-radio:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcelroy-radio:latest
    container_name: mcelroy-radio
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount the location of the audio files - uncomment and adjust paths as needed
      - /home/user/mcelroy-radio/mbmbam:/opt/mcelroy-content/show1
      - /home/user/mcelroy-radio/adventure-zone:/opt/mcelroy-content/show2
      - /home/user/mcelroy-radio/sawbones:/opt/mcelroy-content/show3
      # Mount cache directory for metadata persistence (speeds up subsequent scans dramatically)
      - ./cache:/opt/mcelroy-content/cache
      - ./covers:/app/static/img/covers

      # Mount config directory for custom station configurations
      - ./config:/opt/mcelroy-content/config
    environment:
      - PORT=8080
      - ANALYTICS_PASSWORD="mcelroyradio"
      # Optionally customize content directories
      # - CONTENT_DIRS=/opt/mcelroy-content/show1,/opt/mcelroy-content/show2,/opt/mcelroy-content/show3
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
