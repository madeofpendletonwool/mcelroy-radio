services:
  mcelroy-radio:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcelroy-radio:latest
    container_name: mcelroy-radio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Configure RSS feeds - replace with actual RSS feed URLs
      - RSS_FEEDS=My Brother My Brother and Me:https://feeds.simplecast.com/wjQvYtdl,The Adventure Zone:https://feeds.simplecast.com/cYQVc__c
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
