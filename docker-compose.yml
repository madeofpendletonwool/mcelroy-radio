services:
  mcelroy-radio:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcelroy-radio:latest
    container_name: mcelroy-radio
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount config directory for custom station configurations
      - ./config:/opt/mcelroy-content/config
    environment:
      - PORT=8080
      - RSS_FEEDS=My Brother My Brother and Me:https://feeds.simplecast.com/wjQvYtdl,The Adventure Zone:https://feeds.simplecast.com/cYQVc__c
      - ANALYTICS_PASSWORD=mcelroyradio
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
