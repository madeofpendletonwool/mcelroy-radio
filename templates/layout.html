<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ .Title }}</title>
        <link rel="stylesheet" href="/static/css/styles.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        />
    </head>
    <body>
        <header>
            <div class="nav-container">
                <div class="logo">
                    <a href="/">
                        <h1>McElroy Radio</h1>
                        <span class="tagline">Where the goofs never end!</span>
                    </a>
                </div>
                <nav>
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="/about">About</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main>{{ template "content" . }}</main>

        <footer>
            <div class="footer-container">
                <p>
                    McElroy Radio is a fan-made project and is not affiliated
                    with the McElroy family or their podcasts.
                </p>
                <p>&copy; {{ currentYear }} McElroy Radio</p>
            </div>
        </footer>

        <script src="/static/js/scripts.js"></script>
    </body>
</html>
